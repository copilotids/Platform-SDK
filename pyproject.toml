[project]
name = "platform-sdk"
version = "1.2.0"
description = "Public and stable API between Alchemy Platform and its plugins"
authors = [{name = "manuel", email = "manuel.demas@designcoaching.net"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.3",
    "pydantic-settings>=2.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "safety>=3.8.1",
    "bump2version>=1.0.1",
]

# ruff

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Abilita: E (Pycodestyle), F (Pyflakes), I (Isort), S (Bandit), B (Bugbear)
select = ["E", "F", "I", "S", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# mypy

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# build system

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk"]
