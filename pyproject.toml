[tool.poetry]
name = "platform-sdk"
version = "0.0.1"
description = "Public and stable API between Alchemy Platform and its plugins"
authors = ["manuel <manuel.demas@designcoaching.net>"]
readme = "README.md"
packages = [
    {include = "platform_sdk"}
]
# Include non-Python files in the package
include = []

[tool.poetry.dependencies]
python = "^3.10"

# Validation
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Utilities
python-dotenv = "^1.2.1"
structlog = "^23.2.0"
sdnotify = "^0.3.2"
inflect = "^7.5.0"

[tool.poetry.group.dev.dependencies]
# Code Quality
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
# Security
bandit = "^1.8.6"
safety = "^3.6.2"
# Development
pre-commit = "^3.5.0"
ipython = "^8.17.2"
bump2version = "^1.0.1"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
